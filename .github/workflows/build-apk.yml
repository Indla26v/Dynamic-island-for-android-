name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # The runner ships the Android SDK; add the platform this project compiles against.
      - name: Install SDK platform 37
        run: |
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          # Newer platforms are published as e.g. android-37.0, so look the name up.
          PLATFORM=$("$SDKMANAGER" --list 2>/dev/null | grep -oE 'platforms;android-37[^ ]*' | sort -uV | head -1)
          echo "Installing $PLATFORM"
          "$SDKMANAGER" "$PLATFORM" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: island-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
